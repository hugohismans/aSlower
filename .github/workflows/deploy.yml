# Teste la physique, construit le jeu et le publie sur GitHub Pages à chaque push sur main.
# https://hugohismans.github.io/aSlower/
#
# Réglage du dépôt (une seule fois) : Settings → Pages → Build and deployment → Source :
# « GitHub Actions ». Pas de .nojekyll : le déploiement par artefact ne lance pas Jekyll.
#
# Les actions sont épinglées par SHA de commit (le commentaire donne la version) ;
# Dependabot (.github/dependabot.yml) propose leurs mises à jour, après 14 jours de recul.
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  # Relance manuelle depuis l'onglet Actions.
  workflow_dispatch:

# Moindre privilège : lecture seule par défaut ; seul le job deploy écrit sur Pages.
permissions:
  contents: read

# Un seul déploiement à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node (version de .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances (versions exactes de package-lock.json)
        run: npm ci

      - name: Tester (physique, couleurs, rendu, formats, stockage, pureté, licences)
        run: npm test

      # Le script postbuild (scripts/check-dist.mjs) vérifie ensuite que l'en-tête
      # OpenRelativity et les textes de licence sont bien dans dist/ ; sinon, échec.
      - name: Construire et vérifier les licences du site
        run: npm run build

      - name: Téléverser le site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Droits d'écriture limités à ce job : publier sur Pages (jeton OIDC).
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
